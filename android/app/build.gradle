apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// Single source of truth for the app version is package.json, so a web release
// and the APK/AAB can never disagree. versionCode is derived from the semver so
// it always increases with the version: 1.2.3 -> 10203.
def appVersion = new JsonSlurper().parse(rootProject.file("../package.json")).version
def (verMajor, verMinor, verPatch) = appVersion.tokenize('.').collect { it.toInteger() }
def appVersionCode = verMajor * 10000 + verMinor * 100 + verPatch

// Release signing config is read from keystore.properties (kept out of git).
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// A release build with no keystore used to succeed and quietly emit an unsigned
// APK, which then fails at install time with no explanation. Fail here instead,
// but only when a release artifact is actually being asked for, so a fresh
// checkout can still run debug builds and tests.
def buildingRelease = gradle.startParameter.taskNames.any { it =~ /(?i)(assemble|bundle|install|publish).*release/ }
if (buildingRelease && !keystorePropsFile.exists()) {
    throw new GradleException(
        "Cannot build a release artifact: android/keystore.properties is missing.\n" +
        "It must define storeFile, storePassword, keyAlias and keyPassword. " +
        "The file and the .keystore it points at are deliberately kept out of git.")
}

android {
    namespace "com.milkymart.clone"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.milkymart.clone"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
            // v1 is still required by minSdk 23 (pre-Android 7 has no v2/v3).
            // v3 is what makes signing-key rotation possible later on, so it is
            // switched on now — it cannot be added retroactively to old installs.
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// kotlin-stdlib resolves to 1.8.22 while transitive deps still pin
// kotlin-stdlib-jdk7/jdk8 at 1.6.21. Kotlin 1.8 folded the jdk7/jdk8 classes into
// the main stdlib, so mixing the two versions makes dex fail on duplicate classes.
// Aligning every stdlib artifact turns jdk7/jdk8 back into empty stubs.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin'
                && details.requested.name.startsWith('kotlin-stdlib')) {
            details.useVersion '1.8.22'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
